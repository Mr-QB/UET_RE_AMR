# Zenoh bridge for ROS 2 (DDS <-> Zenoh), next to the dev container (host network).
#   docker compose -f docker/compose.zenoh.yml up -d
# A remote machine runs its own bridge: zenoh-bridge-ros2dds -e tcp/<robot-ip>:7447
services:
  zenoh-bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    container_name: uet_amr_zenoh
    network_mode: host
    restart: unless-stopped
    init: true
    command: ["-c", "/etc/zenoh-bridge.json5"]
    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      CYCLONEDDS_URI: file:///etc/zenoh-cyclonedds.xml
      RUST_LOG: info,zenoh_plugin_ros2dds::route_service_srv=trace
    volumes:
      - ./zenoh-cyclonedds.xml:/etc/zenoh-cyclonedds.xml:ro
      - ./zenoh-bridge.json5:/etc/zenoh-bridge.json5:ro
