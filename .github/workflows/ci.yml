name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flake8
      - run: flake8 ros2/src
      - name: Shell syntax
        run: for f in scripts/amr scripts/common.sh scripts/lib/*.sh; do bash -n "$f"; done
      - name: Launch files compile
        run: python3 -m py_compile ros2/src/*/launch/*.py
