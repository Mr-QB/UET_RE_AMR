teleop_twist_joy:
  ros__parameters:
    axis_linear:
      x: 1          # left stick vertical
    scale_linear:
      x: 0.3

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.9

    # Deadman: the robot only moves while L2 is held.
    require_enable_button: true
    enable_button: 6
