# Same as nav2.yaml, except local_costmap's depth-camera obstacle source:
# voxel_layer's fused scan+pointcloud is split into scan_layer (RPLidar,
# unchanged) + nvblox_layer (D435i depth, via isaac_ros_nvblox's GPU-
# accelerated reconstruction instead of the CPU voxel grid). Selected by
# navigation.launch.py's use_nvblox argument. See docs/isaac_ros_setup.md.
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_nav_to_pose_bt_xml: ""   # filled in by navigation.launch.py with config/behavior_trees/nav_to_pose_backup_first.xml
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/filtered   # default "odom" has no publisher: the controller saw zero speed and capped turns at 0.32 rad/s
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.7
      lookahead_dist: 0.6
      min_lookahead_dist: 0.5   # was 1.0/2.0: a 1-2 m carrot sits past a door frame, so the arc cut the corner and the collision check stopped the robot
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.7
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false   # was true: it slowed the robot to ~0.25 m/s beside walls, i.e. in the doorway, where the door is a 1-2 % ramp and the wheels already struggle to get out
      inflation_cost_scaling_factor: 10.0   # must equal the local costmap inflation_layer cost_scaling_factor
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true   # in place ONLY when the path is >~86 deg off (rotate_to_heading_min_angle); smaller turns, such as doors, still arc. With false and no reversing, a path behind the robot had no way to start.
      allow_reversing: false   # heading-free planner never asks for it; RPP otherwise drove whole routes backward
      rotate_to_heading_min_angle: 1.5
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # Heading-free grid planner. The footprint-aware Hybrid-A* (kept below, commented out) forces the goal heading, so
    # it looped at goals; its Reeds-Shepp variant made Regulated Pure Pursuit drive whole routes in reverse (it cannot
    # follow cusps). SmacPlanner2D plans positions only, so no loops and no reversing; path is smoothed.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false   # unknown (grey) cells are not plannable, so paths stay inside the mapped white area
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 4.0   # step cost = 1 + 4 x cost/252: a 0.3 m corner (cost 206) is ~4.3x an open step. 2.0 (~2.6x) hugged corners; higher centres the path more but also avoids doors if any detour is under ~3x longer
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.4   # fidelity to the A* path (cost aware); lower = smoother but cuts corners
        tolerance: 1.0e-10
    # --- previous: SmacPlannerHybrid (footprint aware) ---
    # TEST: footprint-aware Hybrid-A* (was NavfnPlanner: tolerance 0.5, use_astar false, allow_unknown false).
    # NavFn plans a 1-cell-wide line and ignores the 58x52 cm footprint and heading, so it approached doors diagonally.
    # Hybrid-A* checks the real footprint at every pose, so it lines up with a door before turning.
    # REEDS_SHEPP may reverse, but only to turn around (3-point turn instead of a loop): reverse_penalty 3.0 makes a straight
    # reverse of more than ~0.5 m dearer than turning around and driving forward.
#    GridBased:
#      plugin: "nav2_smac_planner/SmacPlannerHybrid"
#      downsample_costmap: false
#      downsampling_factor: 1
#      tolerance: 0.25
#      allow_unknown: false   # unknown (grey) cells are not plannable, so paths stay inside the mapped white area
#      max_iterations: 1000000
#      max_on_approach_iterations: 1000
#      max_planning_time: 2.0
#      motion_model_for_search: "REEDS_SHEPP"
#      angle_quantization_bins: 72
#      analytic_expansion_ratio: 3.5
#      analytic_expansion_max_length: 3.0
#      minimum_turning_radius: 0.15   # was 0.25: the forward-only loop to reach the goal heading is now ~0.3 m across instead of 0.5 m
#      reverse_penalty: 3.0
#      change_penalty: 0.2
#      non_straight_penalty: 1.20
#      cost_penalty: 2.0
#      retrospective_penalty: 0.015
#      lookup_table_size: 20.0
#      cache_obstacle_heuristic: false
#      smooth_path: true
#      smoother:
#        max_iterations: 1000
#        w_smooth: 0.3
#        w_data: 0.2
#        tolerance: 1.0e-10


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0   # display only; Nav2 itself plans against the 10 Hz internal update
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.29, 0.15], [0.29, -0.15], [-0.29, -0.15], [-0.29, 0.15]]"  # LOCAL costmap only: the controller rejects any footprint cell at inscribed cost, and inflation already keeps one half-width off walls, so the real 0.52 m body would need ~1.04 m of corridor. Half-width 0.15 needs ~0.6 m. Global keeps the full 0.52 m footprint.
      plugins: ["scan_layer", "nvblox_layer", "inflation_layer"]
      filters: ["keepout_filter", "speed_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_costmap_filter_info"
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4
      scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      # Fed by nvblox_node's static map slice (see launch/nvblox.launch.py)
      # instead of the D435i pointcloud voxel_layer used in nav2.yaml.
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nvblox_map_slice_topic: /nvblox_node/static_map_slice_clean   # static_map_slice minus cells inside the footprint (nvblox_footprint_filter.py)
        max_obstacle_distance: 1.0
        inflation_distance: 0.0
        convert_to_binary_costmap: false
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0   # display only; internal update is 5 Hz
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: false
      resolution: 0.05
      footprint: "[[0.29, 0.26], [0.29, -0.26], [-0.29, -0.26], [-0.29, 0.26]]"  # 58 cm long x 52 cm wide (tyres 50.5 cm + margin), centred on base_footprint
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_costmap_filter_info"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0   # middle ground: paths keep ~0.45-0.5 m off walls in open space but a 0.7 m gap still plans (cost < 253 once the centre is >0.26 m from a wall). Was 10.0 / 0.4, which let NavFn hug walls.
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 1.0]   # = diff_drive_controller angular.z.max_velocity (controllers.yaml); raise both together
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.2, 0.0, -3.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
