controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.45      # [m] -- matches firmware's Odom wheel_base (hoverboardSerial.h)
    wheel_radius: 0.085         # [m] -- matches firmware's Odom wheel_radius = 8.5 cm (hoverboardSerial.h)

    use_stamped_vel: false

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0          # [Hz]
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: false
    enable_odom_tf: false
    cmd_vel_timeout: 0.5        # [s]

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.5         # [m/s]
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0     # [m/s^2]

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0        # [rad/s]
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0    # [rad/s^2]
